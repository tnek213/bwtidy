## Builds the image from this checkout instead of pulling it. Everything else comes from
## compose.yaml, so run both files.
## How to run it: docs/how-to/run.md
services:
  bwtidy:
    ## the local build's name, instead of BWTIDY_IMAGE
    image: bwtidy:local
    build:
      context: .
      target: app
      args:
        BWTIDY_COMMIT: ${BWTIDY_COMMIT:-}
        ## the Kroki server that renders the diagrams of the docs, https://kroki.io when unset
        BWTIDY_KROKI_URL: ${BWTIDY_KROKI_URL:-}
