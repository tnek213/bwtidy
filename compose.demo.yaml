name: bwtidy-demo

## The public demo of bwtidy (dev/demo.md): a Vaultwarden of its own, the demo gateway, the
## controller of the vault pool and an nginx edge. It is not a way to run bwtidy: that is
## compose.yaml.
## Run it: docker compose -f compose.demo.yaml up -d --build (dev/demo.md, Run it).
## Every setting has a default, a .env beside this file or the environment overrides it.

## the demo image, built from this checkout (or a git URL in DEMO_BUILD_CONTEXT) on top of the
## normal image BWTIDY_IMAGE. Three services run it, compose builds it once.
x-demo-image: &demo-image
  image: ${DEMO_IMAGE:-bwtidy-demo:local}
  build:
    context: ${DEMO_BUILD_CONTEXT:-.}
    dockerfile: demo/Dockerfile
    args:
      ## a deploy pins a short-commit tag or a version instead of main
      BWTIDY_IMAGE: ${BWTIDY_IMAGE:-docker.io/tnek213/bwtidy:main}

## the same as compose.yaml: the logs of a long running container never fill the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ## writes the stack's secrets (tokens, the CA and Vaultwarden's certificate) into the volume
  ## unless it holds them already, gives them their owners and the ledger to the controller,
  ## then exits. The others wait for it.
  init:
    <<: *demo-image
    command: ["bwtidy-demo-init"]
    restart: "no"
    network_mode: none
    volumes:
      - secrets:/secrets
      - ledger:/ledger
    read_only: true
    cap_drop:
      - ALL
    ## root without CHOWN could not give a file the controller's group or the controller
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    ## dev/demo.md, Limits and timeouts. A Python process writing a few files, no measure of
    ## its own (it exits in seconds): 128 MiB and 64 processes are ample.
    mem_limit: ${DEMO_MEM_INIT:-128m}
    memswap_limit: ${DEMO_MEM_INIT:-128m}
    pids_limit: ${DEMO_PIDS_INIT:-64}
    logging: *logging

  vaultwarden:
    ## the version of compose.dev.yaml, so the demo runs against the server the tests run against
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ## dev/demo.md, Vaultwarden settings: why each one
    environment:
      DOMAIN: https://vaultwarden
      ROCKET_PORT: "443"
      ROCKET_TLS: '{certs="/secrets/vaultwarden.crt",key="/secrets/vaultwarden.key"}'
      ADMIN_TOKEN_FILE: /secrets/vaultwarden-admin-token
      SIGNUPS_ALLOWED: "true"
      WEB_VAULT_ENABLED: "false"
      SENDS_ALLOWED: "false"
      EMERGENCY_ACCESS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      ORG_CREATION_USERS: none
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ICON_SERVICE: internal
      DISABLE_ICON_DOWNLOAD: "true"
      PUSH_ENABLED: "false"
      ## in KB
      USER_ATTACHMENT_LIMIT: "1024"
      USER_SEND_LIMIT: "1024"
      ## every request comes from the demo or the controller, two addresses for all visitors.
      ## The defaults (a burst of 10 logins, then one per minute) would stop the pool and the
      ## starts. The edge limits the visitors instead.
      LOGIN_RATELIMIT_SECONDS: "1"
      LOGIN_RATELIMIT_MAX_BURST: "1000"
      UNAUTHENTICATED_RATELIMIT_SECONDS: "1"
      UNAUTHENTICATED_RATELIMIT_MAX_BURST: "1000"
      ## the admin login (a burst of 3 per 300 seconds by default) is the controller's alone
      ## and its token is 32 random bytes, so a controller that restarts a few times must not
      ## lock itself out of deleting users
      ADMIN_RATELIMIT_MAX_BURST: "30"
    volumes:
      - secrets:/secrets:ro
    ## temporary on purpose: a restart starts Vaultwarden empty, and the size is all the
    ## visitors can fill
    tmpfs:
      - /data:size=${DEMO_VAULTWARDEN_DATA_SIZE:-256m},mode=0700
    networks:
      - back
    ## the image's own check (it reads ROCKET_TLS), more often than its once a minute so the
    ## stack starts quickly
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ## dev/demo.md, Limits and timeouts. Peak measured 25 MiB with 6 visitors, 42 processes.
    ## memory: (25 + 256 for a full data tmpfs) * 1.25 = 352, rounded up to 384 MiB
    ## processes: 42 * 1.25 = 53, rounded up to 64
    mem_limit: ${DEMO_MEM_VAULTWARDEN:-384m}
    memswap_limit: ${DEMO_MEM_VAULTWARDEN:-384m}
    pids_limit: ${DEMO_PIDS_VAULTWARDEN:-64}
    logging: *logging

  ## the pool of ready vaults and the deletion of Vaultwarden users
  controller:
    <<: *demo-image
    command: ["bwtidy-demo-controller"]
    ## the controller's own user of the demo image (dev/demo.md, Controller), never root
    user: "10100:10100"
    restart: unless-stopped
    init: true
    depends_on:
      init:
        condition: service_completed_successfully
      ## a new Vaultwarden container is empty, so the pool starts over with it
      vaultwarden:
        condition: service_healthy
        restart: true
    environment:
      DEMO_POOL_READY: ${DEMO_POOL_READY:-2}
      DEMO_MAX: ${DEMO_MAX:-6}
      NODE_EXTRA_CA_CERTS: /secrets/ca.crt
    volumes:
      - secrets:/secrets:ro
      ## every id ever used, the one thing that outlives a restart
      - ledger:/ledger
    ## the user's home and bw's state directory of each vault it seeds
    tmpfs:
      - /tmp
    networks:
      - back
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "__import__('socket').create_connection(('127.0.0.1', 8100), 3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ## dev/demo.md, Limits and timeouts. Peak measured 226 MiB while it builds a vault, 16
    ## processes. Its /tmp is a tmpfs that a build leaves almost empty.
    ## memory: 226 * 1.25 = 283, rounded up to 320 MiB
    ## processes: 16 * 1.25 = 20, rounded up to 32
    mem_limit: ${DEMO_MEM_CONTROLLER:-320m}
    memswap_limit: ${DEMO_MEM_CONTROLLER:-320m}
    pids_limit: ${DEMO_PIDS_CONTROLLER:-32}
    logging: *logging

  ## bwtidy's gateway wrapped by bwtidy_demo, and the workers it starts
  demo:
    <<: *demo-image
    command: ["bwtidy-demo-gateway"]
    restart: unless-stopped
    ## as in compose.yaml: a stop reaches the gateway as PID 1, init reaps what it leaves
    init: true
    depends_on:
      init:
        condition: service_completed_successfully
      ## a new Vaultwarden container is empty, so every demo ends with it
      vaultwarden:
        condition: service_healthy
        restart: true
      controller:
        condition: service_healthy
    environment:
      DEMO_CONTROLLER_URL: http://controller:8100
      DEMO_SESSION_MAX: ${DEMO_SESSION_MAX:-2700}
      ## the one server a worker may log in to. The wrapper refuses to start with any other value.
      BWTIDY_ALLOWED_SERVERS: https://vaultwarden
      ## as many visitors at once as the controller has vaults for. 6 fits a 4 GB VPS with 1 GB
      ## free (about 220 MB each, dev/demo.md, Memory)
      BWTIDY_MAX_WORKERS: ${DEMO_MAX:-6}
      BWTIDY_MAX_PENDING: ${DEMO_MAX_PENDING:-2}
      BWTIDY_SESSION_IDLE_TIMEOUT: ${DEMO_SESSION_IDLE:-900}
      ## 1 behind HTTPS (a reverse proxy in front of the edge), empty for plain http on loopback
      BWTIDY_SECURE_COOKIES: ${DEMO_SECURE_COOKIES:-}
      ## the public host name, so MCP's host check passes it. Empty passes only loopback names.
      BWTIDY_MCP_HOSTS: ${DEMO_HOST:-}
      ## the usage stats the start page shows (dev/demo.md, Usage stats), on the stats volume:
      ## the root file system is read-only and the accounts are a tmpfs
      BWTIDY_STATS: "1"
      BWTIDY_STATS_DB: /stats/stats.db
      NODE_EXTRA_CA_CERTS: /secrets/ca.crt
    volumes:
      - secrets:/secrets:ro
      - stats:/stats
    ## the visitors' accounts with their backups, gone with the container. The size is all the
    ## visitors can fill.
    tmpfs:
      - /tmp
      - /data/accounts:size=${DEMO_ACCOUNTS_SIZE:-512m},mode=0755
    networks:
      - back
      - front
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    ## the same as the bwtidy service of compose.yaml: the gateway runs as root and starts
    ## each worker as its account's uid
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 150s
    ## dev/demo.md, Limits and timeouts. For DEMO_MAX 6 visitors, DEMO_MAX_PENDING 2 starts
    ## in flight and a full accounts tmpfs (DEMO_ACCOUNTS_SIZE 512m).
    ## memory: 42 idle + 6 * 220 + 2 * 100 + 512 = 2074, * 1.25 = 2593, rounded up to 2700 MiB
    ## processes: 101 measured with 6 visitors, * 1.25 = 127, rounded up to 128
    mem_limit: ${DEMO_MEM_DEMO:-2700m}
    memswap_limit: ${DEMO_MEM_DEMO:-2700m}
    pids_limit: ${DEMO_PIDS_DEMO:-128}
    logging: *logging

  ## the only container that is on a network with a route out and the only published port
  edge:
    image: nginx:1.30-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    restart: unless-stopped
    depends_on:
      ## nginx looks the name demo up once, at its start, and a new demo container may get
      ## another address
      demo:
        condition: service_healthy
        restart: true
    environment:
      ## per address: a burst, then the rate (nginx's limit_req, r/s or r/m)
      DEMO_START_RATE: ${DEMO_START_RATE:-6r/m}
      DEMO_START_BURST: ${DEMO_START_BURST:-5}
      DEMO_MCP_RATE: ${DEMO_MCP_RATE:-10r/s}
      DEMO_MCP_BURST: ${DEMO_MCP_BURST:-40}
      ## the port nginx listens on inside the container
      DEMO_EDGE_PORT: ${DEMO_EDGE_PORT:-80}
      ## addresses or CIDRs of reverse proxies whose X-Forwarded-For is believed, empty for none
      DEMO_TRUSTED_PROXIES: ${DEMO_TRUSTED_PROXIES:-}
    volumes:
      - ./demo/edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./demo/edge/15-trusted-proxies.sh:/docker-entrypoint.d/15-trusted-proxies.sh:ro
    ## loopback by default: put a reverse proxy with TLS in front, or reach it through a tunnel
    ports:
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-8770}:${DEMO_EDGE_PORT:-80}"
    networks:
      - front
      - public
    ## through nginx to the gateway, so healthy means a visitor gets an answer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${DEMO_EDGE_PORT:-80}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    read_only: true
    ## what nginx writes: the config made from the template, its pid file and its temp files
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    ## the master runs as root, binds port 80 and starts its workers as the user nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ## dev/demo.md, Limits and timeouts. Peak measured 13 MiB, 14 processes (the master, its
    ## workers and the health check). Its tmpfs hold a few small files.
    ## memory: 13 * 1.25 = 17, rounded up to 32 MiB
    ## processes: 14 * 1.25 = 18, rounded up to 32
    mem_limit: ${DEMO_MEM_EDGE:-32m}
    memswap_limit: ${DEMO_MEM_EDGE:-32m}
    pids_limit: ${DEMO_PIDS_EDGE:-32}
    logging: *logging

networks:
  ## internal: no route out of the host and none in. Vaultwarden, the demo and the controller.
  back:
    internal: true
  ## internal too: the edge reaches the demo here and nothing else
  front:
    internal: true
  ## the edge's published port (or the sidecar's route out, dev/demo.md)
  public:
    driver_opts:
      ## a fixed bridge name, so scripts/demo-egress finds this network by it on the host also
      ## after compose makes the network anew (Docker names a bridge br- and a random id)
      com.docker.network.bridge.name: ${DEMO_PUBLIC_BRIDGE:-br-bwtidy-demo}

volumes:
  secrets:
  ledger:
  stats:
