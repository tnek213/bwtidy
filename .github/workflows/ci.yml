# Runs scripts/ci on every push to main, every pull request and on demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # setup-uv publishes no major version tag, only full versions
      # v10.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # the labels of the docs' diagrams need a font of GENERIC_FONTS (scripts/docs-site), and the
      # runner has none
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: scripts/ci
