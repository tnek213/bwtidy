# Builds the image and pushes it to Docker Hub (docker.io/tnek213/bwtidy) on every push to main that changes
# what the image holds and every published release, each with a signed provenance attestation.
# The job skips while the repo is private, as the image is made public together with the repo.
name: Image

on:
  push:
    branches: [main]
    # files the image never copies, so a change to only these builds nothing new
    paths-ignore:
      - README.md
      - docker/hub-overview.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - AGENTS.md
      - CLAUDE.md
      - LICENSE
      - example.env
      - compose.yaml
      - compose.dev.yaml
      - compose.build.yaml
      - dev/**
      - demo/**
      - compose.demo.yaml
      - backend/tests/**
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - .github/workflows/docker-readme.yml
      - .github/workflows/image-scan.yml
      - .github/workflows/prune-tags.yml
      - scripts/prune-tags
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # the provenance attestation: a token from GitHub's OIDC to sign it, and the right to store it
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Work out the tags and labels
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image=docker.io/tnek213/bwtidy
          version="$(node -p "require('./frontend/package.json').version")"
          revision="$(git rev-parse HEAD)"
          # cut, as git abbreviates a hash to more than 7 characters when 7 are ambiguous, and
          # scripts/prune-tags deletes only tags of exactly 7
          short="${revision::7}"
          if [ "$EVENT_NAME" = release ]; then
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "the release tag is $RELEASE_TAG but frontend/package.json has version $version, so the tag must be v$version" >&2
              exit 1
            fi
            tags="$image:$version,$image:latest"
          elif [ "$REF" = refs/heads/main ]; then
            tags="$image:main,$image:$short"
          else
            echo "$EVENT_NAME on $REF does not publish, run it on main" >&2
            exit 1
          fi
          {
            echo "commit=$(git log -1 --format='%cd %h' --date=format:%y%m%d)"
            echo "revision=$revision"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
      - name: Check the Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "set the repository secret DOCKERHUB_TOKEN (a Docker Hub access token with Read and Write)" >&2
            exit 1
          fi
      # v4.8.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: tnek213
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # the star count for the header beside the repository link, so the docs in the image need not
      # ask GitHub for it (scripts/docs-site), and without it the header shows only the version
      - name: Look up the star count
        id: stars
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api repos/${{ github.repository }} --jq .stargazers_count || true)"
          case "$count" in
            ''|*[!0-9]*)
              echo "::warning::no star count from GitHub, the docs header shows only the version"
              count=""
              ;;
          esac
          echo "count=$count" >> "$GITHUB_OUTPUT"
      # v7.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          target: app
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BWTIDY_COMMIT=${{ steps.meta.outputs.commit }}
            BWTIDY_STARS=${{ steps.stars.outputs.count }}
          labels: |
            org.opencontainers.image.source=https://github.com/tnek213/bwtidy
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      # signed SLSA provenance on GitHub and next to the image on Docker Hub: anyone can check that
      # an image was built by this workflow from a given commit (gh attestation verify, dev/release.md)
      # v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: index.docker.io/tnek213/bwtidy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
