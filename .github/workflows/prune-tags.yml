# Deletes the old short-commit tags of docker.io/tnek213/bwtidy every Sunday with scripts/prune-tags, which
# says what it keeps and why. By hand it is a dry run unless dry_run is unticked, on a pull request that
# changes the workflow or the script always a dry run. The job skips while the repo is private.
name: Prune image tags

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be deleted
        type: boolean
        default: true
  pull_request:
    paths: [.github/workflows/prune-tags.yml, scripts/prune-tags]

permissions:
  contents: read

concurrency:
  group: prune-tags-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # every git tag v*, so the short commit of each release stays on Docker Hub
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check the Docker Hub token
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_README_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_PAT" ]; then
            echo "set the repository secret DOCKERHUB_README_TOKEN (a Docker Hub access token with Read, Write, Delete, which deleting a tag needs)" >&2
            exit 1
          fi
      - name: Prune the tags
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_README_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; }; then
            python3 scripts/prune-tags --delete
          else
            python3 scripts/prune-tags
          fi
