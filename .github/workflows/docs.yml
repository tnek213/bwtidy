# Publishes the documentation site on GitHub Pages (https://tnek213.github.io/bwtidy/).
# Both jobs skip while the repo is private, as GitHub's free plan serves Pages only from public repos.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # setup-uv publishes no major version tag, only full versions
      # v10.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      # the star count for the header beside the repository link, so the pages need not ask GitHub
      # for it (scripts/docs-site), and without it the header shows only the version
      - name: Look up the star count
        id: stars
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api repos/${{ github.repository }} --jq .stargazers_count || true)"
          case "$count" in
            ''|*[!0-9]*)
              echo "::warning::no star count from GitHub, the docs header shows only the version"
              count=""
              ;;
          esac
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - run: scripts/docs-site build _site
        env:
          BWTIDY_STARS: ${{ steps.stars.outputs.count }}
      # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
