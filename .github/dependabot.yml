# Weekly updates of every locked dependency, so the lock files, the image digests and the action
# SHAs do not go stale. Minor and patch updates come as one pull request per ecosystem and
# directory, a new major version as a pull request of its own. Their pull requests have the label
# "no release note", as the release notes leave a routine bump out (dev/release.md), and
# Dependabot's own label dependencies, which a list of labels replaces. Those of the Bitwarden CLI
# keep only dependencies, as dependabot-cli-pin.yml writes their release note.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /demo
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      demo-uv-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # the Bitwarden CLI of the image, pinned to one version in its package.json. Its pull requests get
  # the pin commit, with their release note, from dependabot-cli-pin.yml by themselves and merge
  # once ci passes on it.
  - package-ecosystem: npm
    directory: /docker/bitwarden-cli
    schedule:
      interval: weekly
    groups:
      bitwarden-cli-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # markdownlint-cli2, which scripts/ci lints the Markdown files with, pinned to one version in its
  # package.json
  - package-ecosystem: npm
    directory: /tools/markdownlint
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      markdownlint-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # the demo image's own Dockerfile: its uv. Its base is our own image, a build argument.
  - package-ecosystem: docker
    directory: /demo
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      demo-docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # the images compose.demo.yaml pins by tag and digest: the demo's Vaultwarden and nginx. The
  # other compose files name no image with a fixed tag. A new Vaultwarden version goes into
  # compose.dev.yaml in the same pull request, by hand: a repo test keeps the two the same.
  - package-ecosystem: docker-compose
    directory: /
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      compose-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, "no release note"]
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
