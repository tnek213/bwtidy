# The documentation site: scripts/docs-site builds and previews it, the image serves it at /docs/,
# .github/workflows/docs.yml publishes it on GitHub Pages.
[project]
site_name = "bwtidy"
site_description = "A web UI and MCP server for keeping a Bitwarden vault tidy"
docs_dir = "docs"
# the palettes of the two color schemes and the bundled code font
extra_css = ["assets/stylesheets/theme.css"]
repo_url = "https://github.com/tnek213/bwtidy"
repo_name = "tnek213/bwtidy"
# the edit address of every page, which overrides/partials/improve-link.html reads the source path from
edit_uri = "edit/main/docs/"
# no site_url: the pages link to each other relatively, so the site works under /docs/ and /bwtidy/

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    "tutorial/first-cleanup.md",
    "tutorial/template.md",
    "tutorial/mcp.md",
  ] },
  { "How-to guides" = [
    "how-to/run.md",
    "how-to/mcp.md",
    "how-to/show-hide-columns.md",
    "how-to/rename-attachment.md",
    "restore.md",
    "how-to/run-demo.md",
  ] },
  { "Reference" = [
    "reference/ui.md",
    "reference/mcp-tools.md",
    "reference/configuration.md",
    "releases.md",
  ] },
  { "Explanation" = [
    "explanation/overview.md",
    "explanation/login.md",
    "explanation/edits.md",
    "explanation/secrets.md",
    "explanation/mcp.md",
    "explanation/tool-note.md",
    "explanation/bw-cli.md",
    "explanation/isolation.md",
    "explanation/road-to-1.0.md",
  ] },
  { "For contributors" = [
    "contributing.md",
    "spec.md",
    { "The architecture, a map of the code" = "architecture.md" },
  ] },
]

[project.theme]
language = "en"
# main.html there puts the beta disclaimer as a banner above every page, widens the content and
# opens a picture larger on a click
custom_dir = "overrides"
# no fonts from Google Fonts, so a page loads nothing from another host: text uses the system's
# fonts and code IBM Plex Mono, which the site bundles (docs/assets/stylesheets/theme.css)
font = false
features = [
  "content.code.copy",
  # a click on a tab picks the same tab in every tab group of the page, and the choice is kept.
  # The tabs exist only in the build copy that scripts/docs-site makes, from the pairs of shell
  # commands of a page.
  "content.tabs.link",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# the first palette follows the system, the toggle steps through light and dark. The colors are
# custom: docs/assets/stylesheets/theme.css sets them for the schemes default and slate
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# only what renders without a script or a picture from another host (scripts/docs-site checks every
# built page): an emoji shortcode such as :smile: or a mermaid block would load one from a CDN
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
# the icons of the cards, drawn inline from the theme's own icon sets
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
# GitHub's alerts (> [!NOTE], > [!TIP], > [!WARNING]) as boxes, so a box also shows on GitHub
# and reads as a quote in a backup's RESTORE.md
pymdownx.quotes.callouts = true
# the content tabs, which exist only in the build copy that scripts/docs-site makes: it turns each
# pair of shell commands of a page (a Bash and a PowerShell code block) into two tabs
pymdownx.tabbed.alternate_style = true
# a code block even when its info string holds an option it does not know, such as a diagram's
# alt="..." (scripts/docs-site serve shows a diagram as its code block, build makes it a picture
# first). Without it the fence stays text and its closing fence opens a block of what follows.
pymdownx.superfences.relaxed_headers = true
